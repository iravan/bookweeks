name: Build Android, desktop, and macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-builds
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: bookweeks-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Linux app
        run: flutter build linux --release

      - name: Package Linux app
        run: |
          tar -C build/linux/x64/release -czf bookweeks-linux.tar.gz bundle
          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          case "$version" in
            *+*)
              export BOOKWEEKS_VERSION="${version%%+*}"
              export BOOKWEEKS_RELEASE="${version#*+}"
              ;;
            *)
              export BOOKWEEKS_VERSION="$version"
              export BOOKWEEKS_RELEASE=1
              ;;
          esac
          curl -fsSL -o nfpm.tar.gz https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          tar -xzf nfpm.tar.gz nfpm
          mkdir -p dist
          ./nfpm package -f linux/packaging/nfpm.yaml -p deb -t "dist/bookweeks_${BOOKWEEKS_VERSION}-${BOOKWEEKS_RELEASE}_amd64.deb"
          ./nfpm package -f linux/packaging/nfpm.yaml -p rpm -t "dist/bookweeks-${BOOKWEEKS_VERSION}-${BOOKWEEKS_RELEASE}.x86_64.rpm"
          dpkg-deb --info "dist/bookweeks_${BOOKWEEKS_VERSION}-${BOOKWEEKS_RELEASE}_amd64.deb"
          sudo apt-get install -y rpm
          rpm -qip "dist/bookweeks-${BOOKWEEKS_VERSION}-${BOOKWEEKS_RELEASE}.x86_64.rpm"

      - uses: actions/upload-artifact@v7
        with:
          name: bookweeks-linux
          path: |
            bookweeks-linux.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Windows app
        run: flutter build windows --release

      - name: Package Windows app
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath bookweeks-windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: bookweeks-windows
          path: bookweeks-windows.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package macOS app
        run: |
          APP=$(echo build/macos/Build/Products/Release/*.app)
          ditto -c -k --keepParent "$APP" bookweeks-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: bookweeks-macos
          path: bookweeks-macos.zip
          if-no-files-found: error

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign
